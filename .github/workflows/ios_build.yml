name: Build Money Handler for iPhone 13

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App on Cloud Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS App with xcodebuild
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Create iOS Package (.ipa / App Bundle)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r MoneyHandler_iPhone13.ipa Payload

      - name: Upload iPhone 13 Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyHandler_iPhone13_Installer
          path: MoneyHandler_iPhone13.ipa
