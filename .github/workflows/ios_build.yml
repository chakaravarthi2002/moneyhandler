name: Build Money Handler for iPhone 13

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App on Cloud Mac
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build iOS App with xcodebuild
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -target iosApp \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package iOS App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphonesimulator/iosApp.app Payload/
          zip -r MoneyHandler_iPhone13.zip Payload/

      - name: Upload iPhone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyHandler_iPhone_App
          path: MoneyHandler_iPhone13.zip
